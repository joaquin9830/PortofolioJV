<section id="education" class="education-section section-wrap" aria-labelledby="education-heading">
  <div class="section-inner">
    <header class="education-header">
      <span class="section-eyebrow" appScrollReveal [revealDelay]="0">Formación</span>
      <h2 id="education-heading" class="section-heading" appScrollReveal [revealDelay]="80">
        Respaldo académico y técnico.
      </h2>
      <p class="section-lead" appScrollReveal revealVariant="fade" [revealDelay]="160">
        Formación que complementa la experiencia en proyectos reales.
      </p>
    </header>

    <div class="education-list">
      <article class="panel-card edu-item card-fill"
               *ngFor="let item of educationItems; let i = index"
               appScrollReveal
               [revealDelay]="i * 100">
        <div class="edu-item-main">
          <div class="edu-meta">
            <span class="edu-tag">{{ item.tag }}</span>
            <span class="edu-period">{{ item.period }}</span>
          </div>
          <h3 class="edu-degree">{{ item.degree }}</h3>
          <p class="edu-institution">{{ item.institution }}</p>
          <div class="edu-highlights">
            <span class="edu-chip" *ngFor="let h of item.highlights">{{ h }}</span>
          </div>
        </div>
        <button type="button"
                class="btn btn-ghost btn-sm edu-link card-footer-align"
                (click)="goToDetail(item.route)">
          Ver detalle
          <i class="bi bi-arrow-right" aria-hidden="true"></i>
        </button>
      </article>
    </div>
  </div>
</section>
